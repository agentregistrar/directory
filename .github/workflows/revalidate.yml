# Before public launch, pin third-party actions by commit SHA.

name: revalidate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revalidate providers
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm verify --write | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the revalidation branch and issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/verification.json; then
            echo "No verification changes."
            exit 0
          fi

          branch="revalidate/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/verification.json
          git commit -m "chore: revalidate providers"
          git push --force origin "$branch"

          compare="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          failing=$(jq -r '.entries | to_entries[] | select(.value.status == "failing") | "- `\(.key)`"' data/verification.json)
          body="Automated revalidation changed \`data/verification.json\`."$'\n\n'"Open a pull request from the branch:"$'\n'"$compare"
          if [ -n "$failing" ]; then
            body="$body"$'\n\n'"Failing providers:"$'\n'"$failing"
          fi

          gh label create revalidation --color FBCA04 --description "Automated provider revalidation" 2>/dev/null || true
          existing=$(gh issue list --label revalidation --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Provider revalidation updates" --body "$body" --label revalidation
          fi
