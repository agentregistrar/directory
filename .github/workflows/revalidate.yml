# Before public launch, pin third-party actions by commit SHA.

name: revalidate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revalidate providers
        continue-on-error: true
        run: pnpm verify --write
      - name: Open a pull request for verification changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/verification.json; then
            echo "No verification changes."
            exit 0
          fi
          branch="revalidate/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/verification.json
          git commit -m "chore: revalidate providers"
          git push origin "$branch"
          if gh pr list --head "$branch" --json number --jq '.[0].number' | grep -q .; then
            echo "A revalidation pull request already exists for $branch."
          else
            gh pr create \
              --title "Revalidate providers" \
              --body "Automated revalidation of the provider entries. Review the verification diff and merge if the checks are correct." \
              --head "$branch" \
              --base main
          fi
      - name: Report failing providers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failing=$(jq -r '.entries | to_entries[] | select(.value.status == "failing") | "- `\(.key)`"' data/verification.json)
          if [ -z "$failing" ]; then
            echo "No failing providers."
            exit 0
          fi
          gh label create revalidation --color FBCA04 --description "Automated provider revalidation" 2>/dev/null || true
          body="Revalidation found failing providers:"$'\n\n'"$failing"
          existing=$(gh issue list --label revalidation --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Provider revalidation failures" --body "$body" --label revalidation
          fi
