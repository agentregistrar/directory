name: Remove a listing
description: Request removal of a provider listing.
title: "Remove: "
body:
  - type: input
    id: listing
    attributes:
      label: Listing URL
      placeholder: https://agentregistrar.directory/p/...
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the provider
      options:
        - Owner or maintainer
        - Authorized representative
        - Other
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why should the listing be removed?
    validations:
      required: true
